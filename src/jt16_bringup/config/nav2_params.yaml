amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.01
    alpha2: 0.01
    alpha3: 0.01
    alpha4: 0.01
    alpha5: 0.001
    min_particles: 500
    max_particles: 2000
    max_beams: 180
    laser_model_type: likelihood_field
    laser_max_range: 20.0
    laser_likelihood_max_dist: 1.0
    laser_sigma_hit: 0.1
    update_min_d: 0.1
    update_min_a: 0.1
    resample_interval: 1
    set_initial_pose: false
    tf_broadcast: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose: {plugin: nav2_bt_navigator::NavigateToPoseNavigator}
    navigate_through_poses: {plugin: nav2_bt_navigator::NavigateThroughPosesNavigator}

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 60.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: -0.10
      max_vel_x: 0.35
      max_vel_theta: 0.6
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0
      acc_lim_x: 0.8
      acc_lim_theta: 1.0
      decel_lim_x: -0.8
      decel_lim_theta: -1.0
      vx_samples: 20
      vtheta_samples: 20
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      trans_stopped_velocity: 0.1
      xy_goal_tolerance: 0.10
      short_circuit_trajectory_evaluation: true
      publish_evaluation: false
      publish_trajectories: false
      stateful: true
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, GoalAlign, PathAlign, PathDist, GoalDist]
      ObstacleFootprint.scale: 0.10
      PathAlign.scale: 0.0
      GoalAlign.scale: 0.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.20,0.235],[0.20,-0.235],[-0.20,-0.235],[-0.20,0.235]]"
      plugins: [obstacle_layer, motion_prediction, inflation_layer]
      motion_prediction:
        plugin: jt16_bringup::PredictionLayer
        enabled: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        min_obstacle_height: -0.5
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          # Projection already filters real base-relative height; odom starts at the IMU.
          min_obstacle_height: -0.5
          clearing: true
          marking: true
          obstacle_max_range: 3.0
          raytrace_max_range: 8.0
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.75
        cost_scaling_factor: 2.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      footprint: "[[0.20,0.235],[0.20,-0.235],[-0.20,-0.235],[-0.20,0.235]]"
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        min_obstacle_height: -0.5
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          min_obstacle_height: -0.5
          clearing: true
          marking: true
          obstacle_max_range: 3.0
          raytrace_max_range: 8.0
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.75
        cost_scaling_factor: 2.0

map_server:
  ros__parameters:
    use_sim_time: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.25
      use_astar: false
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [SimpleSmoother]
    SimpleSmoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin: {plugin: nav2_behaviors::Spin}
    backup: {plugin: nav2_behaviors::BackUp}
    drive_on_heading: {plugin: nav2_behaviors::DriveOnHeading}
    wait: {plugin: nav2_behaviors::Wait}

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 10
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.50, 0.0, 0.6]
    min_velocity: [-0.10, 0.0, -0.6]
    max_accel: [0.8, 0.0, 1.0]
    max_decel: [-0.8, 0.0, -1.0]
    odom_topic: odom
    odom_duration: 0.1
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    transform_tolerance: 0.2
    source_timeout: 1.0
    stop_pub_timeout: 2.0
    polygons: [SlowCircle, FootprintApproach]
    SlowCircle:
      type: circle
      radius: 0.65
      action_type: limit
      min_points: 4
      linear_limit: 0.10
      angular_limit: 0.6
      visualize: false
      enabled: true
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 2.0
      simulation_time_step: 0.1
      min_points: 4
      visualize: false
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true

docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 1
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: [simple_charging_dock]
    simple_charging_dock:
      plugin: opennav_docking::SimpleChargingDock
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.05
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      transform_tolerance: 0.2
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    bond_timeout: 10.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    bond_timeout: 10.0
